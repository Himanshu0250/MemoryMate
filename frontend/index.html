<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MemoryMate — Never Forget the Little Things That Matter</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Standard & Favicon Icons -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MemoryMate" />
    
    <!-- Android / Chrome Theme -->
    <meta name="theme-color" content="#0B0F17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MemoryMate" />
    <meta name="msapplication-TileColor" content="#0B0F17" />
    
    <!-- SEO & Sharing Meta -->
    <meta name="description" content="MemoryMate: Private AI-powered memory assistant built with open-weight Gemma AI for Hacktoberfest 2026 'Build for a Friend' challenge. Never forget the little things that matter." />
    
    <style>
      /* Fallback splash spinner */
      #pwa-splash {
        position: fixed;
        inset: 0;
        background-color: #07090e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f8fafc;
        z-index: 9999;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
        animation: splash-pulse 2s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.8)); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-dark-950 dark:text-slate-100 min-h-screen">
    <div id="root">
      <div id="pwa-splash">
        <div class="splash-logo">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
          </svg>
        </div>
        <div style="margin-top: 20px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em;">MemoryMate</div>
        <div style="margin-top: 6px; font-size: 12px; color: #94a3b8;">Never forget the little things that matter</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
